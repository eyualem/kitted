<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../mockups/">
<title>T118 design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a review board. Journey sections of 300px phones on a cool fitting-room grey.
   Selvedge-indigo ink, one copper-rivet accent, dashed seams as dividers, care-label mono for data. */
:root{
  --page:#E5E7EB; --page-2:#F1F2F4; --page-ink:#131726; --page-ink-2:#565C6B; --page-line:#C8CCD4; --rivet:#9C5326;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Archivo",Arial,sans-serif;
  /* app tokens, light */
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF1; --ink:#121628; --ink-2:#585E70; --ink-3:#848A99;
  --line:#E0E3E8; --accent:#9C5326; --accent-soft:rgba(156,83,38,.11); --primary:#121628; --on-primary:#FFFFFF;
  --good:#2B7651; --glass:rgba(250,250,252,.80); --me:#1B2340; --on-me:#F2F3F7; --dim:rgba(10,12,20,.42);
  --shadow:0 1px 2px rgba(18,22,40,.05),0 6px 18px rgba(18,22,40,.06);
  --bezel:#1B1D22;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0A0C11; --page-2:#11141B; --page-ink:#E8EAF0; --page-ink-2:#9198A7; --page-line:#252A37; --rivet:#D8915A;
    --bg:#0C0E14; --surface:#171A23; --surface-2:#21252F; --ink:#ECEEF3; --ink-2:#A1A7B5; --ink-3:#6E7484;
    --line:#2A2F3B; --accent:#DE9762; --accent-soft:rgba(222,151,98,.15); --primary:#ECEEF3; --on-primary:#0C0E14;
    --good:#5DC08F; --glass:rgba(32,35,46,.78); --me:#2A3150; --on-me:#EEF0F6; --dim:rgba(0,0,0,.55);
    --shadow:0 0 0 1px rgba(255,255,255,.03); --bezel:#2A2D34; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0A0C11; --page-2:#11141B; --page-ink:#E8EAF0; --page-ink-2:#9198A7; --page-line:#252A37; --rivet:#D8915A;
  --bg:#0C0E14; --surface:#171A23; --surface-2:#21252F; --ink:#ECEEF3; --ink-2:#A1A7B5; --ink-3:#6E7484;
  --line:#2A2F3B; --accent:#DE9762; --accent-soft:rgba(222,151,98,.15); --primary:#ECEEF3; --on-primary:#0C0E14;
  --good:#5DC08F; --glass:rgba(32,35,46,.78); --me:#2A3150; --on-me:#EEF0F6; --dim:rgba(0,0,0,.55);
  --shadow:0 0 0 1px rgba(255,255,255,.03); --bezel:#2A2D34; color-scheme:dark;
}
/* App appearance switch (overrides the page theme inside the phones only) */
.board[data-app="light"] .phone:not(.fixed){
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF1; --ink:#121628; --ink-2:#585E70; --ink-3:#848A99;
  --line:#E0E3E8; --accent:#9C5326; --accent-soft:rgba(156,83,38,.11); --primary:#121628; --on-primary:#FFFFFF;
  --good:#2B7651; --glass:rgba(250,250,252,.80); --me:#1B2340; --on-me:#F2F3F7; --dim:rgba(10,12,20,.42);
  --shadow:0 1px 2px rgba(18,22,40,.05),0 6px 18px rgba(18,22,40,.06); color-scheme:light;
}
.board[data-app="dark"] .phone:not(.fixed), .phone.fixed{
  --bg:#0C0E14; --surface:#171A23; --surface-2:#21252F; --ink:#ECEEF3; --ink-2:#A1A7B5; --ink-3:#6E7484;
  --line:#2A2F3B; --accent:#DE9762; --accent-soft:rgba(222,151,98,.15); --primary:#ECEEF3; --on-primary:#0C0E14;
  --good:#5DC08F; --glass:rgba(32,35,46,.78); --me:#2A3150; --on-me:#EEF0F6; --dim:rgba(0,0,0,.55);
  --shadow:0 0 0 1px rgba(255,255,255,.03); color-scheme:dark;
}

html,body{background:var(--page);color:var(--page-ink)}
body{font-family:var(--display);font-stretch:100%;-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0 80px}
*{box-sizing:border-box}
.board{max-width:1360px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rivet);outline-offset:2px}

/* ---------- Board header ---------- */
.masthead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:56px 36px;border-bottom:1px solid var(--page-line)}
.mast-left{display:flex;flex-direction:column;gap:22px;min-width:0}
.mark-row{display:flex;align-items:center;gap:16px}
.appicon{width:64px;height:64px;border-radius:15px;background:radial-gradient(120% 90% at 30% 15%,#2F3B66 0%,#1B2340 55%,#121830 100%);position:relative;display:grid;place-items:center;box-shadow:0 8px 24px rgba(18,24,48,.28);flex:none}
.appicon::before{content:"";position:absolute;inset:6px;border-radius:10px;border:1.3px dashed rgba(222,151,98,.75)}
.appicon span{font-family:var(--display);font-stretch:125%;font-weight:760;font-size:30px;color:#EEF0F5;letter-spacing:-.02em;line-height:1}
.woven{display:inline-flex;align-items:center;position:relative;background:#1B2340;color:#EEF0F5;font-family:var(--display);font-stretch:125%;font-weight:700;letter-spacing:.34em;font-size:12px;padding:8px 22px 8px 25px;border-radius:2px;line-height:1}
.woven::before,.woven::after{content:"";position:absolute;top:3px;bottom:3px;border-left:1px dashed rgba(238,240,245,.55)}
.woven::before{left:7px}.woven::after{right:7px}
.woven.sm{font-size:8.5px;padding:6px 16px 6px 18px;letter-spacing:.32em}
.woven.sm::before{left:5px}.woven.sm::after{right:5px}
.woven.copper{background:var(--accent);color:var(--on-primary)}
h1.board-title{font-family:var(--display);font-stretch:118%;font-weight:720;font-size:clamp(34px,5.4vw,64px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1.board-title em{font-style:normal;font-stretch:72%;font-weight:500;color:var(--page-ink-2);letter-spacing:-.01em}
.mast-right{display:flex;flex-direction:column;gap:18px;min-width:0}
.lede{font-size:15.5px;line-height:1.55;color:var(--page-ink-2);margin:0;max-width:60ch}
.lede b{color:var(--page-ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11.5px;color:var(--page-ink-2);text-transform:uppercase;letter-spacing:.06em}
.switch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.switch .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-ink-2)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--page-2);border:1px solid var(--page-line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--page-ink-2)}
.seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}

/* ---------- System strip ---------- */
.system{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--page-line);border:1px solid var(--page-line);margin-block:36px 8px;border-radius:14px;overflow:hidden}
.sys{background:var(--page-2);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sys h3{margin:0;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-ink-2)}
.sys p{margin:0;font-size:13px;line-height:1.5;color:var(--page-ink-2)}
.sys p b{color:var(--page-ink);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10px;color:var(--page-ink-2)}
.sw i{width:40px;height:40px;border-radius:9px;display:block;border:1px solid rgba(128,128,128,.25)}
.type-a{font-family:var(--display);font-stretch:72%;font-weight:650;font-size:44px;line-height:.9;letter-spacing:-.02em;color:var(--page-ink)}
.type-b{font-family:var(--display);font-stretch:125%;font-weight:700;font-size:11px;letter-spacing:.3em;color:var(--page-ink)}
.type-c{font-family:var(--mono);font-size:11px;color:var(--page-ink-2);letter-spacing:.04em}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.4;color:var(--page-ink-2)}
.rules li{display:flex;gap:8px}.rules li::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--rivet)}

/* ---------- Sections ---------- */
.flow{padding-block:54px 8px}
.flow-head{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px 40px;align-items:baseline;padding-bottom:26px;margin-bottom:30px;border-bottom:1px dashed var(--page-line)}
.flow-head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rivet);display:block;margin-bottom:8px}
.flow-head h2{margin:0;font-family:var(--display);font-stretch:115%;font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.flow-head p{margin:0;font-size:14.5px;line-height:1.55;color:var(--page-ink-2);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:44px 26px}
.shot{margin:0;width:315px;display:flex;flex-direction:column;gap:16px}
.shot figcaption{display:flex;flex-direction:column;gap:5px;padding-inline:4px}
.shot figcaption b{font-size:14px;font-weight:650;letter-spacing:-.005em;display:flex;gap:8px;align-items:baseline}
.shot figcaption b small{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--rivet);letter-spacing:.06em}
.shot figcaption span{font-size:12.5px;line-height:1.5;color:var(--page-ink-2)}
.foot{margin-top:70px;padding-top:24px;border-top:1px solid var(--page-line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.foot h4{margin:0 0 8px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rivet)}
.foot p{margin:0;font-size:13px;line-height:1.55;color:var(--page-ink-2)}

/* ---------- Phone ---------- */
.phone{zoom:.735;width:428px;height:900px;border-radius:71px;background:var(--bezel);padding:13px;position:relative;box-shadow:0 0 0 1.5px rgba(128,132,145,.35),0 39px 78px -26px rgba(16,20,36,.35),0 15.5px 31px -15.5px rgba(16,20,36,.25);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ios);font-size:17px;line-height:1.36;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:19px;background:#000;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:4px 36px 0 50px;font-weight:600;font-size:17px;z-index:25;color:var(--ink)}
.status.on-dark{color:#fff}
.status .sig{display:flex;gap:6.5px;align-items:center}
.status svg{display:block}
.status .sig svg:nth-child(1){width:19px;height:12px}.status .sig svg:nth-child(2){width:17px;height:12px}.status .sig svg:nth-child(3){width:27px;height:13px}
.status .sig{gap:6px}
.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:4px;background:var(--ink);opacity:.85;z-index:40}
.homebar.on-dark{background:#fff}
.content{position:absolute;inset:62px 0 0 0;overflow:hidden;display:flex;flex-direction:column}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.ic.s{width:19.5px;height:19.5px;stroke-width:1.9}
.ic.xs{width:15.5px;height:15.5px;stroke-width:2.2}

/* nav */
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none;position:relative}
.nav .t{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.nav .t small{font-weight:500;font-size:12px;color:var(--ink-3)}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);position:relative;z-index:2;border:0}
.circ.glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(15.5px);-webkit-backdrop-filter:blur(15.5px)}
.bigtitle{font-size:34px;font-weight:700;letter-spacing:-.02em;padding:5px 21px 10.5px;line-height:1.1;display:flex;justify-content:space-between;align-items:center}
.progress{display:flex;gap:5px;flex:1;margin:0 18px;position:relative;z-index:2}
.progress i{height:4px;border-radius:2.5px;background:var(--line);flex:1}
.progress i.on{background:var(--ink)}

/* chat */
.thread{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px 16px 0;overflow:hidden;min-height:0}
.thread.end{justify-content:flex-end}
.say{max-width:92%;font-size:17px;line-height:1.42;color:var(--ink)}
.say .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-3);margin-bottom:4px;letter-spacing:.01em}
.who i{width:18px;height:18px;border-radius:5px;background:#1B2340;display:inline-grid;place-items:center;font-style:normal;font-family:var(--display);font-stretch:125%;font-weight:760;font-size:10.5px;color:#EEF0F5}
.me{align-self:flex-end;max-width:78%;background:var(--me);color:var(--on-me);padding:10.5px 15.5px;border-radius:23.5px 23.5px 6.5px 23.5px;font-size:17px;line-height:1.35}
.me.photo{padding:4px;border-radius:21px 21px 6.5px 21px;display:flex;flex-direction:column;gap:0;width:135px}
.me.photo .ph{height:171.5px;border-radius:17px 17px 4px 17px;overflow:hidden}
.me.photo .cap{font-size:13.5px;padding:6.5px 9px 5px;display:flex;justify-content:space-between;opacity:.9}
.ph svg{width:100%;height:100%;display:block}
.stamp{align-self:center;font-size:13px;color:var(--ink-3);font-weight:500}

.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;flex:none}
.card-pad{padding:14px 16px}
.tagline{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tagline b{color:var(--ink-2);font-weight:500}
.seam{height:1px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 5px,transparent 5px 9px);opacity:.45;margin:0 18px}
.score-row{display:flex;align-items:flex-end;gap:15.5px}
.score{font-family:var(--display);font-stretch:70%;font-weight:640;font-size:75.5px;line-height:.82;letter-spacing:-.025em;color:var(--ink);display:flex;align-items:flex-start}
.score sub{font-family:var(--mono);font-stretch:100%;font-size:14.5px;font-weight:400;color:var(--ink-3);letter-spacing:0;align-self:flex-end;margin-left:4px;margin-bottom:5px}
.verdict{display:flex;flex-direction:column;gap:4px;padding-bottom:4px;min-width:0}
.verdict b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.verdict span{font-size:14.5px;color:var(--ink-2)}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.sub{display:flex;flex-direction:column;gap:6.5px}
.sub .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.sub .k b{font-family:var(--ios);font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:0}
.bar{height:5px;border-radius:2.5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2.5px}
.summary{font-size:16px;line-height:1.42;color:var(--ink)}
.fixes{display:flex;flex-direction:column}
.fix{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11.5px;align-items:center;padding:10.5px 0}
.fix+.fix{border-top:1px solid var(--line)}
.fix .n{width:26px;height:26px;border-radius:50%;border:1.3px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.fix .what{display:flex;flex-direction:column;gap:2.5px;min-width:0}
.fix .what b{font-size:16px;font-weight:600;line-height:1.25}
.fix .what span{font-size:13.5px;color:var(--ink-3)}
.gain{font-family:var(--mono);font-size:14.5px;color:var(--accent);font-weight:500;white-space:nowrap}
.gain.big{font-size:15.5px}
.fix.done .n{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fix.done .what b{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.added{display:flex;align-items:center;gap:10.5px;font-size:15px;color:var(--ink-2)}
.added .thumbs{display:flex}
.added .thumbs span{width:28.5px;height:28.5px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--surface);margin-left:-8px;display:grid;place-items:center;overflow:hidden}
.added .thumbs span:first-child{margin-left:0}
.added .thumbs svg{width:23.5px;height:23.5px}
.added a{margin-left:auto;color:var(--accent);font-weight:600;text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:36px;padding:0 16px;border-radius:18px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--ios);font-size:15px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink);cursor:default}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.lg{height:50px;border-radius:25px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.out{background:transparent;border:1px solid var(--line)}
.btn.icon{width:36px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6.5px;font-size:15px;font-weight:550;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.ac{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10.5px;border-radius:13px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:transparent;border:1px solid var(--line);color:var(--good)}

/* composer + quick start + tabbar */
.dock{flex:none;display:flex;flex-direction:column;gap:10px;padding:8px 16px 92px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.both{display:flex;justify-content:space-between;align-items:baseline;padding:10.5px 0 8px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.both b{font-family:var(--mono);font-weight:500;font-size:15.5px;color:var(--accent)}
.ledger .tot span:first-child small{display:block;font-weight:400;font-size:13px;color:var(--ink-3)}
.quickrow{display:flex;gap:8px;overflow:hidden;margin-right:-15.5px}
.qc{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
.qc .ic{color:var(--ink-2)}
.fitbtn{height:40px;padding:0 16px 0 13px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:650;flex:none;white-space:nowrap}
.cfix{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 92px;z-index:15;background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.phone[data-composer] .thread.end{padding-bottom:146px}
.scale{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:13px 36.5px;align-items:center;padding:23.5px 28.5px;border:1px solid var(--page-line);border-radius:18px;background:var(--page-2);margin-top:15.5px}
.scale-t{font-family:var(--mono);font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-ink-2)}

.lock{background:radial-gradient(130% 70% at 20% 0%,#3A4670 0%,#1B2340 45%,#0B0E1A 100%)!important}
.locktime{font-family:var(--display);font-stretch:62%;font-weight:600;font-size:112px;line-height:.95;letter-spacing:-.02em}
.notif{display:grid;grid-template-columns:39px minmax(0,1fr);gap:11.5px;padding:13px 14.5px;border-radius:26px;background:rgba(240,242,248,.2);backdrop-filter:blur(31px) saturate(1.4);-webkit-backdrop-filter:blur(31px) saturate(1.4);color:#fff;align-items:start}
.notif:nth-child(2){opacity:.92}.notif:nth-child(3){opacity:.84}
.nic{width:39px;height:39px;border-radius:10px;background:radial-gradient(120% 90% at 30% 15%,#2F3B66,#1B2340 55%,#121830);display:grid;place-items:center;position:relative}
.nic::before{content:"";position:absolute;inset:4px;border-radius:6.5px;border:1px dashed rgba(222,151,98,.75)}
.nic span{font-family:var(--display);font-stretch:125%;font-weight:760;font-size:18px;color:#EEF0F5}
.nh{display:flex;justify-content:space-between;font-size:15px}
.nh span{opacity:.7;font-size:13.5px}
.notif p{margin:1px 0 0;font-size:15px;line-height:1.32}

/* closet */
.rotation{display:flex;flex-direction:column;gap:15.5px}
.ess{display:flex;flex-direction:column;gap:8px}
.slots{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.slots i{height:8px;border-radius:4px;background:var(--surface-2)}
.slots i.f{background:var(--ink)}
.nextbuy{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14.5px;align-items:center;padding:13px 15.5px}
.nextbuy .tile svg{width:78%;height:78%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10.5px 8px}
.grid3 .tile{aspect-ratio:1/.92;max-width:100%}
.tile.ghosted{background:transparent;border:1.5px dashed var(--ink-3)}
.tile.ghosted svg{opacity:.5}

/* lookbook */
.intent{display:flex;align-items:center;gap:18px;padding:2.5px 2.5px}
.intent>div:not(.vr):not(.intent-l){display:flex;align-items:baseline;gap:6.5px}
.intent span{font-size:14.5px;color:var(--ink-2)}
.intent .vr{width:1px;height:34px;background:var(--line)}
.intent-l{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:right;line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2.5px;text-align:center}
.cal .dow{font-size:11.5px;font-weight:600;color:var(--ink-3);padding-bottom:5px}
.cal .d{height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink-2);position:relative;border-radius:10.5px}
.cal .d.wk{background:var(--surface-2)}
.cal .d.wk.first{border-radius:10.5px 0 0 10.5px}.cal .d.wk.last{border-radius:0 10.5px 10.5px 0}.cal .d.wk.mid{border-radius:0}
.cal .d.log{color:var(--ink);font-weight:650}
.cal .d.log::after{content:"";width:5px;height:5px;border-radius:2.5px;background:var(--accent);position:absolute;bottom:2.5px}
.cal .d.today span{width:27.5px;height:27.5px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;margin-top:-4px}
.cal .d.fut{color:var(--ink-3);opacity:.6}
.look-row{display:grid;grid-template-columns:49.5px minmax(0,1fr) 21px;gap:13px;align-items:center;color:var(--ink-3)}
.look-row b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:620;color:var(--ink)}
.look-row div span{font-size:13.5px;color:var(--ink-2)}
.lr-ph{width:49.5px;height:62.5px;border-radius:11.5px;overflow:hidden;display:block;flex:none}
.lr-ph svg{width:100%;height:100%;display:block}

/* you */
.knows{display:flex;flex-direction:column}
.fact{display:flex;align-items:center;gap:13px;padding:10.5px 17px;color:var(--ink-3)}
.fact+.fact{border-top:1px solid var(--line)}
.fact div{flex:1;min-width:0}
.fact b{display:block;font-size:15.5px;font-weight:600;color:var(--ink)}
.fact div span{font-size:13px;color:var(--ink-3)}
.fact.guess b{font-style:italic;font-weight:550;color:var(--ink-2)}
.privacy-row{display:flex;align-items:center;gap:11.5px;font-size:15.5px;font-weight:550;color:var(--ink);padding:5px 5px}
.privacy-row .ic{color:var(--ink-3)}

/* paywall */
.today{display:grid;grid-template-columns:49.5px minmax(0,1fr);gap:13px;align-items:center;padding:10.5px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.today b{display:block;font-size:16px;font-weight:650}
.today span{font-size:13.5px;color:var(--ink-2)}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:16px;font-weight:550}
.perks li{display:flex;align-items:center;gap:10.5px}
.perks .ic{color:var(--accent)}
.plans{display:flex;flex-direction:column;gap:9px}
.plan{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-radius:19.5px;border:1.5px solid var(--line);background:var(--surface);position:relative}
.plan.on{border-color:var(--ink)}
.plan b{display:block;font-size:17px;font-weight:650}
.plan div span{font-size:13.5px;color:var(--ink-2)}
.plan .pr{display:flex;align-items:baseline;gap:1px}
.plan .pr b{font-family:var(--display);font-stretch:80%;font-size:24.5px;font-weight:650}
.badge{position:absolute;top:-10.5px;right:15.5px;height:21px;padding:0 9px;border-radius:10.5px;background:var(--accent);color:var(--on-primary);font-size:11.5px;font-weight:700;display:flex;align-items:center;letter-spacing:.02em}

/* share */
.sharecard{position:relative;aspect-ratio:9/16;border-radius:18px;overflow:hidden;max-width:100%;box-shadow:0 20px 40px -12px rgba(0,0,0,.6)}
.shr{display:flex;flex-direction:column;align-items:center;gap:6.5px;font-size:13.5px;font-weight:600}
.shr span{width:57px;height:57px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}

@media (max-width:960px){
  .masthead{grid-template-columns:minmax(0,1fr);gap:26px;padding-block:36px 28px}
  .system{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow-head{grid-template-columns:minmax(0,1fr)}
  .foot{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{padding-inline:16px}
  .system{grid-template-columns:minmax(0,1fr)}
  .row{justify-content:center}
}

function gi(t,c){

  const LS='M21,9 L13,12 L9,20 L5,50 L12,51 L16,29 L16,53 L44,53 L44,29 L48,51 L55,50 L51,20 L47,12 L39,9 Q30,15 21,9 Z';

  if(t==='tee')p=`<path d="M21,9 L13,12 L5,20 L10,27 L16,24.5 L16,52 L44,52 L44,24.5 L50,27 L55,20 L47,12 L39,9 Q30,16 21,9 Z" fill="${c}" ${st}/><path d="M21,9 Q30,16 39,9" fill="none" stroke="${d}" stroke-width="1.7"/>`;
  else if(t==='oxford')p=`<path d="${LS}" fill="${c}" ${st}/><path d="M21,9 L30,14 L26,21 L18.5,13 Z M39,9 L30,14 L34,21 L41.5,13 Z" fill="${l}" ${st}/><path d="M30,14 V53" stroke="${d}" stroke-width="1"/>`+[24,32,40,48].map(y=>`<circle cx="31.6" cy="${y}" r=".9" fill="${d}"/>`).join('');
  else if(t==='overshirt'||t==='jacket')p=`<path d="${LS}" fill="${c}" ${st}/><path d="M21,9 L30,15 L25,23 L17,13 Z M39,9 L30,15 L35,23 L43,13 Z" fill="${shade(c,-.12)}" ${st}/><path d="M30,15 V53" stroke="${d}" stroke-width="1.4"/><rect x="19" y="24" width="8" height="7" rx="1" fill="${l}" ${st}/><rect x="33" y="24" width="8" height="7" rx="1" fill="${l}" ${st}/>`+(t==='jacket'?`<path d="M17,40 H43" stroke="#C98A4A" stroke-width=".8" stroke-dasharray="1.6 1.4"/>`:'');
  else if(t==='sweater')p=`<path d="${LS}" fill="${c}" ${st}/><path d="M21,9 Q30,17 39,9" fill="none" stroke="${d}" stroke-width="2.6"/><path d="M16.5,49.5 H43.5 M5.6,46.5 L12.3,47.4 M54.4,46.5 L47.7,47.4" stroke="${d}" stroke-width="2"/>`;
  else if(t==='hoodie')p=`<path d="${LS}" fill="${c}" ${st}/><path d="M22,11 Q30,22 38,11 Q37,3 30,3 Q23,3 22,11 Z" fill="${shade(c,-.15)}" ${st}/><path d="M21,37 L39,37 L41,48 L19,48 Z" fill="none" ${st}/>`;
  else if(['chino','jeans','trouser','cargo'].includes(t)){p=`<path d="M17,6 L43,6 L45,55 L34,55 L30,21 L26,55 L15,55 Z" fill="${c}" ${st}/><path d="M17,10.5 H43" stroke="${d}" stroke-width="1"/>`;if(t==='jeans')p+=`<path d="M18,11 Q22,18 27,11 M42,11 Q38,18 33,11 M17.6,14 L16,54 M42.4,14 L44,54" stroke="#C98A4A" stroke-width=".8" fill="none" stroke-dasharray="1.6 1.3"/>`;else p+=`<path d="M19,11 L23,19 M41,11 L37,19" stroke="${d}" stroke-width="1"/>`}
  else if(t==='sneaker'||t==='runner'){p=`<path d="M5,42 Q6,32 15,30 L27,27 Q31,33 41,35 Q53,37 55,43 L55,45 L5,45 Z" fill="${c}" ${st}/><path d="M4,45 L56,45 L56,48.5 Q30,50.5 4,48.5 Z" fill="${t==='runner'?'#ECECE8':'#FFFFFF'}" stroke="#C9C9C4" stroke-width=".9"/><path d="M24,30 L27,35 M28.5,29 L31.5,34" stroke="${d}" stroke-width="1"/>`;if(t==='runner')p+=`<path d="M12,40 Q26,34 44,40" stroke="#D9733A" stroke-width="2" fill="none" stroke-linecap="round"/>`}
  else if(t==='boot')p=`<path d="M13,12 L30,12 L31,33 Q46,35 53,40 L54,45 L11,45 L11,30 Z" fill="${c}" ${st}/><path d="M10,45 H55 V49.5 H10 Z" fill="#2A1D14"/><path d="M13,18 H30" stroke="${d}" stroke-width="1"/>`;
  else if(t==='loafer')p=`<path d="M5,41 Q8,32 20,32 L33,32 Q47,33 53,38 L55,45 L5,45 Z" fill="${c}" ${st}/><path d="M4,45 H56 V47.5 H4 Z" fill="${shade(c,-.5)}"/><path d="M26,33.5 Q33,38 42,35.5" stroke="${d}" stroke-width="1.3" fill="none"/>`;
  return `<svg viewBox="0 0 60 60" aria-hidden="true">${p}</svg>`;
}

}

const STATUS=t=>`<span>${t}</span><span class="sig"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.5" y="5" width="3" height="6" rx=".8"/><rect x="9" y="2.5" width="3" height="8.5" rx=".8"/><rect x="13.5" y="0" width="3" height="11" rx=".8"/></svg><svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.2c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .7 3.4l1.1 1.1a8 8 0 0 1 5.7-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.1c.5 0 .9.2 1.2.5L7.5 10.2 6.3 9c.3-.3.7-.5 1.2-.5z"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4z" fill="currentColor" opacity=".45"/></svg></span>`;
const TABS=[['stylist','Stylist','i-chat'],['closet','Closet','i-hanger'],['lookbook','Lookbook','i-book'],['you','You','i-person']];

document.querySelectorAll('.phone').forEach(ph=>{
  const sc=ph.querySelector('.screen');
  const isl=document.createElement('div');isl.className='island';sc.appendChild(isl);
  const st=document.createElement('div');st.className='status';

  sc.appendChild(st);

  if(ph.dataset.tab){const tb=document.createElement('nav');tb.className='tabbar';tb.setAttribute('aria-label','Tabs');tb.innerHTML=TABS.map(([k,l,i])=>`<a class="${k===ph.dataset.tab?'on':''}" href="#"><svg class="ic"><use href="#${i}"/></svg>${l}</a>`).join('');sc.appendChild(tb)}
  const hb=document.createElement('div');hb.className='homebar';sc.appendChild(hb);

document.querySelectorAll('[data-fig]').forEach(el=>{
  const o=FIG[el.dataset.fig];if(!o)return;
  const r=el.clientWidth/Math.max(1,el.clientHeight);
  el.innerHTML=figure(o,{head:el.dataset.head==='1',guide:el.dataset.guide==='1',fit:(el.dataset.fit==='meet'||r>.85)?'xMidYMid meet':'xMidYMid slice'});
});

// Real photos (Unsplash/Pexels test set). neck/foot/cx/fy/fr are fractions of the image: chin line, feet, body center, face center and face radius.
const PH={
  p01b:{neck:.315,foot:.985,cx:.50,fx:.505,fy:.245,fr:.055,box:[.24,.175,.76,.995]},
  p01a:{neck:.315,foot:.985,cx:.45,fx:.46,fy:.235,fr:.05,box:[.24,.17,.70,.995]},
  s24:{neck:.31,foot:1,cx:.55,fx:.55,fy:.25,fr:.08},
  s15:{neck:.235,foot:.895,cx:.50,fx:.50,fy:.17,fr:.04},
  s10:{neck:.28,foot:.94,cx:.43,fx:.44,fy:.235,fr:.04},
  s14:{neck:.21,foot:.94,cx:.46,fx:.47,fy:.16,fr:.045},
  s22:{neck:.32,foot:1,cx:.45,fx:.45,fy:.27,fr:.05},
  s05:{neck:.195,foot:.95,cx:.48,fx:.49,fy:.14,fr:.045},
  s13:{neck:.30,foot:.965,cx:.48,fx:.48,fy:.255,fr:.04},
  s12:{neck:.235,foot:.875,cx:.55,fx:.56,fy:.18,fr:.04},
  s25:{neck:.30,foot:.99,cx:.45,fx:.45,fy:.23,fr:.06},
  s09:{neck:.22,foot:.89,cx:.52,fx:.52,fy:.17,fr:.04}
};
function placePhoto(el){
  const k=el.dataset.photo,c=PH[k];if(!c)return;
  const mode=el.dataset.crop||'neck';
  if(getComputedStyle(el).position==='static')el.style.position='relative';
  el.style.overflow='hidden';
  const wrap=document.createElement('div');wrap.style.position='absolute';
  const img=new Image();img.alt='';img.decoding='async';img.src='img/'+k+'.jpg';
  Object.assign(img.style,{position:'absolute',inset:'0',width:'100%',height:'100%',display:'block',maxWidth:'none'});
  wrap.appendChild(img);
  const fit=()=>{
    const W=el.clientWidth||1,H=el.clientHeight||1,ar=img.naturalWidth/img.naturalHeight,box=W/H;
    const top=mode==='neck'?c.neck:(mode==='blur'?Math.max(0,c.fy-c.fr*2.4):0);
    const span=(mode==='full'?1:c.foot+.012)-top;
    let ih=1/span, iw=ih*ar/box;          // in units of container height / width
    if(iw<1){iw=1;ih=box/ar}
    let left=.5-c.cx*iw;left=Math.min(0,Math.max(1-iw,left));
    let t=-top*ih;t=Math.min(0,Math.max(1-ih,t));
    Object.assign(wrap.style,{width:iw*100+'%',height:ih*100+'%',left:left*100+'%',top:t*100+'%'});
    if((mode==='blur'||el.dataset.blurface)&&!wrap.querySelector('.faceblur')){
      const b=document.createElement('div');b.className='faceblur';
      const rx=c.fr/ar*100*1.15, ry=c.fr*100*1.25;
      Object.assign(b.style,{left:(c.fx*100-rx)+'%',top:(c.fy*100-ry)+'%',width:rx*2+'%',height:ry*2+'%'});
      wrap.appendChild(b);
    }
    if(el.dataset.guide&&c.box&&!wrap.querySelector('.guide')){
      const g=document.createElementNS('http://www.w3.org/2000/svg','svg');g.setAttribute('class','guide');g.setAttribute('viewBox','0 0 100 100');g.setAttribute('preserveAspectRatio','none');
      const [x0,y0,x1,y1]=c.box;Object.assign(g.style,{left:x0*100+'%',top:y0*100+'%',width:(x1-x0)*100+'%',height:(y1-y0)*100+'%'});
      g.innerHTML='<ellipse cx="50" cy="7.5" rx="11" ry="7" fill="none" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M28,19 Q50,14 72,19 Q84,22 85,32 L83,97 Q83,100 79,100 L21,100 Q17,100 17,97 L15,32 Q16,22 28,19 Z" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>';
      wrap.appendChild(g);
    }
  };
  if(img.complete&&img.naturalWidth)fit();else img.addEventListener('load',fit);
  el.appendChild(wrap);
}
document.querySelectorAll('[data-photo]').forEach(placePhoto);

document.querySelectorAll('[data-gi]').forEach(el=>{const [t,c]=el.dataset.gi.split(':');el.innerHTML=gi(t,c)});
document.querySelectorAll('[data-sil]').forEach(el=>{el.innerHTML=sil()+(el.dataset.sil?`<div style="text-align:center;font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px">${el.dataset.sil}</div>`:'')});

// October 2026 starts on a Thursday. Today is the 22nd.
const cal=document.getElementById('cal');
if(cal){
  const logged=new Set([1,2,5,6,7,9,12,13,14,15,16,19,20,21,22]);
  let h=['S','M','T','W','T','F','S'].map(d=>`<span class="dow">${d}</span>`).join('');
  for(let i=0;i<4;i++)h+='<span></span>';
  for(let d=1;d<=31;d++){
    const cls=['d'];if(logged.has(d))cls.push('log');if(d===22)cls.push('today');if(d>22)cls.push('fut');
    if(d>=18&&d<=24){cls.push('wk',d===18?'first':d===24?'last':'mid')}
    h+=`<span class="${cls.join(' ')}"><span>${d}</span></span>`;
  }
  cal.innerHTML=h;
}

// App appearance switch
const board=document.getElementById('board');
const btns=document.querySelectorAll('.seg button');
const setApp=v=>{board.dataset.app=v;btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));try{localStorage.setItem('kitted-app',v)}catch(e){}};
btns.forEach(b=>b.addEventListener('click',()=>setApp(b.dataset.v)));
try{const v=localStorage.getItem('kitted-app');if(v)setApp(v)}catch(e){}

})();
