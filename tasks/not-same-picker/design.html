<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not the same: What is it, then?</title>
<style>
:root{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
.light{--bg:#F3F4F6;--surface:#fff;--surface2:#ECEEF1;--ink:#121628;--ink2:#585E70;--ink3:#646A7A;--faint:#848A99;--line:#E0E3E8;--accent:#9C5326;--accentSoft:rgba(156,83,38,.09);--primary:#1A2448;--onPrimary:#fff;--me:#22305C;--dim:rgba(10,12,20,.42);--good:#2B7651}
.dark{--bg:#0C0E14;--surface:#171A23;--surface2:#21252F;--ink:#ECEEF3;--ink2:#A1A7B5;--ink3:#9096A5;--faint:#6E7484;--line:#2A2F3B;--accent:#DE9762;--accentSoft:rgba(222,151,98,.15);--primary:#ECEEF3;--onPrimary:#0C0E14;--me:#2B3860;--dim:rgba(0,0,0,.55);--good:#5DC08F}
body{margin:0;background:#8a8d94}
.panel{background:var(--bg);color:var(--ink);padding:28px 32px 44px;margin-bottom:0}
.light.panel{background:#D9DCE2}.dark.panel{background:#05060A}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 8px;color:var(--ink2);font-weight:600}
.note{font-size:13px;color:var(--ink2);margin:0 0 10px;max-width:1300px;line-height:1.5}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cell{width:393px}
.cap{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink2);margin:0 0 8px;min-height:68px}
.cap b{color:var(--ink)}
/* phone */
.phone{width:393px;height:852px;border-radius:54px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.25)}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font:600 16px -apple-system,sans-serif;z-index:3;color:var(--ink)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:4}
.sb-r{display:flex;gap:6px;align-items:center}.sb-r i{display:block;background:var(--ink);border-radius:2px}
.home{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--ink);opacity:.9;z-index:6}
.nav{position:absolute;top:54px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px}
.thread{position:absolute;top:104px;left:0;right:0;bottom:90px;padding:0 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.bubble-photo{align-self:flex-end;width:132px;height:168px;border-radius:21px 21px 6px 21px;overflow:hidden;background:linear-gradient(160deg,#6a625a,#3d3934);position:relative;display:grid;place-items:center}
.composer{position:absolute;bottom:26px;left:16px;right:16px;height:48px;border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;padding:0 16px;color:var(--ink3);font-size:16px}
.dim{position:absolute;inset:0;background:var(--dim);z-index:5}
/* card */
.card{background:var(--surface);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--ink3)}
.score{display:flex;align-items:flex-end;gap:10px}
.num{font:700 52px/0.95 "SF Pro Display",-apple-system,sans-serif;letter-spacing:-2px}
.den{font:13px ui-monospace,Menlo,monospace;color:var(--ink3);padding-bottom:5px}
.verdict{font-size:15px;line-height:1.3;color:var(--ink2)}.verdict b{color:var(--ink)}
.closetrow{display:flex;gap:8px;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.closetrow .tl{margin-left:auto}
.tl{font-size:14px;font-weight:600;color:var(--accent)}
.q{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.q .t{font-size:15px;font-weight:600;line-height:1.25}
.q .r{font-size:13px;color:var(--ink2);line-height:1.3}
.pair{display:flex;gap:12px}
.fr{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;color:var(--ink2)}
.crop{border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#6a625a,#3d3934);position:relative;display:grid;place-items:center}
.crop::after{content:"";position:absolute;inset:14% 12%;border:2px solid rgba(255,255,255,.85);border-radius:10px}
.tilebox{border-radius:14px;background:var(--surface2);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;border-radius:16px;padding:0 10px;display:flex;align-items:center;font-size:15px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-6px 0}
.chip.press{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip.sel{background:var(--ink);color:var(--surface);box-shadow:none}
.chip.new{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.said{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:38px 38px 0 0;z-index:6;overflow:hidden;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
.sheet.med{height:511px}.sheet.lg{top:16px}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--faint);opacity:.6}
.sh-head{display:flex;align-items:flex-start;gap:8px;padding:26px 16px 10px 20px}
.sh-titles{flex:1;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.sh-title{font:700 22px/1.18 -apple-system,sans-serif;letter-spacing:-.3px}
.sh-sub{font-size:15px;color:var(--ink2);line-height:1.3}
.ib{width:36px;height:36px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;position:relative;flex:none}
.ib::after{content:"";position:absolute;inset:-4px}
.ib svg{width:16px;height:16px}
.sh-body{padding:4px 16px 0;display:flex;flex-direction:column;gap:12px}
.ref{background:var(--surface);border-radius:20px;padding:10px 12px;display:flex;gap:12px;align-items:center;min-height:64px}
.ref .nm{font-size:15px;font-weight:600}.ref .cp{font-size:13px;color:var(--ink2)}
.nrow{background:var(--surface);border-radius:20px;min-height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;box-sizing:border-box}
.nrow .pl{width:30px;height:30px;border-radius:15px;background:var(--surface2);display:grid;place-items:center}
.nrow .ch{margin-left:auto}
.sec{font-size:13px;font-weight:600;color:var(--ink2);padding:6px 4px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:10px;row-gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;position:relative}
.tile .bx{height:104px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;position:relative}
.tile .lb{font-size:13px;color:var(--ink2);line-height:1.2;min-height:32px}
.tile.sel .bx{box-shadow:0 0 0 2.5px var(--ink)}
.tile.sel .lb{color:var(--ink);font-weight:600}
.badge{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.badge svg{width:13px;height:13px;stroke:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;row-gap:10px}
.grid2 .bx{height:104px}
.grid2 .lb{font-size:17px;font-weight:600;color:var(--ink);min-height:0;text-align:left;padding-left:2px}
.btnp{height:36px;border-radius:18px;background:var(--primary);color:var(--onPrimary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;position:relative}
.btnp::after{content:"";position:absolute;inset:-4px 0}
.listrow{background:var(--surface);border-radius:20px;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 16px;min-height:64px}
.listrow .nm{font-size:15px;font-weight:600}.listrow .dt{font-size:13px;color:var(--ink2)}
svg{display:block}
.artbox svg{width:100%;height:100%}
.fine{font-size:12px;color:var(--ink2);line-height:1.5}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px 28px;max-width:1700px}
.notes div{font-size:13px;line-height:1.5;color:var(--ink2)}.notes b{color:var(--ink)}
</style></head><body><div id="root"></div>

const art=(k,s,sc,extra='')=>`<div class="artbox" style="width:${s}px;height:${s}px;${extra}">${FLATS[k+'.'+sc]}</div>`;
const status=()=>`<div class="status"><span>9:41</span><div class="sb-r"><i style="width:17px;height:11px"></i><i style="width:15px;height:11px"></i><i style="width:25px;height:12px;border-radius:4px"></i></div></div><div class="island"></div>`;
const crop=(w,h,sc)=>`<div class="crop" style="width:${w}px;height:${h}px">${art('greyCrew',Math.round(w*0.92),sc,'position:relative;z-index:1')}</div>`;
const tilebox=(k,w,h,sc)=>`<div class="tilebox" style="width:${w}px;height:${h}px">${art(k,Math.round(w*0.82),sc)}</div>`;

/* ---------- the chat card ---------- */
function chatCard(sc,state){
 const pair=(k,nm)=>`<div class="pair"><div class="fr">${crop(120,120,sc)}This photo</div><div class="fr">${tilebox(k,120,120,sc)}In your closet</div></div>`;
 let q;
 if(state==='ask'||state==='press'){
  q=`<div class="q"><div style="display:flex;flex-direction:column;gap:3px"><div class="t">Is this your grey quarter-zip?</div><div class="r">The fit looked a little different in this photo.</div></div>${pair('quarterZip')}
   <div class="chips"><div class="chip">Yes, same one</div><div class="chip ${state==='press'?'press':''}">Not the same</div><div class="chip">It's my navy sweater</div></div></div>`;
 }else if(state==='pick'){
  q=`<div class="said"><span>Saved as your navy sweater.</span><span class="tl">Change</span></div>`;
 }else{
  q=`<div class="said"><span>Saved as its own piece: grey sweater.</span><span class="tl">Change</span></div>`;
 }
 return `<div class="card"><div class="mono">Fit check · Full</div>
  <div class="score"><div class="num">7.0</div><div class="den">/10</div><div class="verdict"><b>Put together</b><br>Good base. One easy change sharpens it.</div></div>
  <div class="closetrow"><span>Added 2 to Closet</span><span class="tl">Review</span></div>${q}</div>`;
}
function chat(sc,state,inner=''){
 return `<div class="phone ${sc}">${status()}<div class="nav">Kit</div>
 <div class="thread"><div class="bubble-photo">${art('greyCrew',120,sc)}</div>${chatCard(sc,state)}</div>
 <div class="composer">Ask your stylist…</div>${inner}<div class="home"></div></div>`;
}
/* ---------- the sheet ---------- */
const head=(title,sub,{back}={})=>`<div class="grab"></div><div class="sh-head">${back?`<div class="ib" style="margin-top:0">${IC.back}</div>`:''}<div class="sh-titles"><div class="sh-title">${title}</div>${sub?`<div class="sh-sub">${sub}</div>`:''}</div><div class="ib">${IC.x}</div></div>`;
const refRow=(sc,compact)=>`<div class="ref">${crop(52,60,sc)}<div style="display:flex;flex-direction:column;gap:1px"><div class="cp">This photo</div><div class="nm">Grey crewneck sweater</div></div></div>`;
const newRow=()=>`<div class="nrow"><div class="pl">${IC.plus}</div>It's a new piece<div class="ch">${IC.chev}</div></div>`;
const TOPS=[['navyCrew','Navy sweater'],['whiteTee','White tee'],['blackTee','Black tee'],['oliveHood','Olive hoodie'],['tanOver','Tan overshirt'],['blueShirt','Blue button-up']];
const grid=(sc,sel)=>`<div class="grid3">${TOPS.map(([k,n])=>`<div class="tile ${sel===k?'sel':''}"><div class="bx">${art(k,86,sc)}${sel===k?`<div class="badge">${IC.check}</div>`:''}</div><div class="lb">${n}</div></div>`).join('')}</div>`;
function sheetPick(sc,detent){
 return `<div class="sheet med"><div class="grab"></div>${''}
  ${head('What is it, then?','Pick the one it is, or add it as new.')}
  <div class="sh-body">${refRow(sc)}${newRow()}<div class="sec">Tops</div>${grid(sc)}</div></div>`;
}
function sheetConfirm(sc){
 return `<div class="sheet lg">
  ${head('What is it, then?','Pick the one it is, or add it as new.')}
  <div class="sh-body"><div class="card" style="border-radius:20px;gap:10px;padding:14px">
    <div class="t" style="font-size:15px;font-weight:600">Is this your navy sweater?</div>
    <div class="pair" style="justify-content:center"><div class="fr">${crop(150,140,sc)}This photo</div><div class="fr">${tilebox('navyCrew',150,140,sc)}In your closet</div></div>
    <div class="btnp">Yes, same one</div></div>
   ${newRow()}<div class="sec">Tops</div>${grid(sc,'navyCrew')}</div></div>`;
}
const KINDS=[['kSweater','Sweater'],['kTee','Tee'],['kShirt','Shirt'],['kHoodie','Hoodie']];
const kindGrid=(sc)=>`<div class="grid2 tile">${KINDS.map(([k,n])=>`<div class="tile"><div class="bx">${art(k,92,sc)}</div><div class="lb">${n}</div></div>`).join('')}</div>`;
function sheetKind(sc,{empty}={}){
 return `<div class="sheet med">
  ${head('What kind of piece is it?',empty?'Nothing else like it in your closet yet.':'',{back:!empty})}
  <div class="sh-body">${refRow(sc)}${kindGrid(sc)}</div></div>`;
}
const withSheet=(sc,state,sheet)=>chat(sc,state,`<div class="dim"></div>${sheet}`);

function frames(sc){
 const F=[
  ['1 · Where it starts','The question on the score card. <b>No, a new one</b> becomes <b>Not the same</b>; the other chips are as today.',chat(sc,'press')],
  ['2 · The sheet opens (medium)','<b>What is it, then?</b> The photographed piece for reference, <b>It\'s a new piece</b> first, then his tops. Pulls up to large.',withSheet(sc,'press',sheetPick(sc))],
  ['3 · He picks a piece (large)','A tap selects it and shows it beside the photo with the existing <b>Yes, same one</b>. Nothing is saved until then.',withSheet(sc,'press',sheetConfirm(sc))],
  ['4 · It\'s a new piece: the kind','Same words as Kit\'s add card (T106). One tap on a kind saves the piece as new and closes the sheet.',withSheet(sc,'press',sheetKind(sc))],
  ['5 · Back on the card: picked a piece','Existing line <b>Saved as your {item}.</b> and <b>Change</b>.',chat(sc,'pick')],
  ['6 · Back on the card: new piece','Existing line <b>Saved as its own piece: {item}.</b> and <b>Change</b>.',chat(sc,'new')],
  ['7 · Empty: nothing else like it','No grid to show, so the sheet opens straight on the kind question, with one line saying why. No Back.',withSheet(sc,'press',sheetKind(sc,{empty:true}))]
 ];
 return F.map(([t,d,h])=>`<div class="cell"><div class="cap"><b>${t}</b><br>${d}</div>${h}</div>`).join('');
}
function other(sc){
 return `<div class="cell phone-less ${sc}" style="background:var(--bg);padding:0 0 0 0">
 <div class="cap"><b>8 · Where else it opens</b><br>The Added sheet's <b>Not the same</b> on a piece the app matched, and the Closet tab's question card. Both open this same sheet.</div>
 <div style="display:flex;flex-direction:column;gap:14px">
  <div class="listrow"><div class="tilebox" style="width:44px;height:44px;border-radius:12px;flex:none">${art('whiteTee',36,sc)}</div><div style="flex:1"><div class="nm">White tee</div><div class="dt">Top · Regular fit</div></div><div class="tl">Not the same</div></div>
  <div class="card" style="border-radius:26px"><div class="q" style="border:0;padding:0"><div style="display:flex;flex-direction:column;gap:3px"><div class="t">Is this your grey quarter-zip?</div><div class="r">The fit looked a little different in this photo.</div></div><div class="chips"><div class="chip">Yes, same one</div><div class="chip">Not the same</div><div class="chip">It's my navy sweater</div><div class="chip" style="box-shadow:none;background:none;color:var(--accent)">Skip ›</div></div></div></div>
 </div></div>`;
}
function panel(sc){
 return `<div class="panel ${sc}"><h1>Not the same → What is it, then? · ${sc}</h1>
 <p class="note">iPhone 17 Pro, 393 × 852 pt, 1 CSS px = 1 pt. Drawings are the app's own <code>flats.ts</code> output, not mock shapes. His photo crop is a stand-in. Sheet = <code>SheetScaffold</code> on the same formSheet as "Same as which piece?" (detents 0.6 and 1). Tiles are 3 across at about 113 × 104 pt like that picker; chips are the small 32 pt capsule with its 44 pt tap area. No emoji, no all-caps, copper only on text links.</p>
 <div class="row">${frames(sc)}${other(sc)}</div></div>`;
}
document.getElementById('root').innerHTML=
`<div class="panel light" style="padding-bottom:6px"><h1>Not the same: the "What is it, then?" sheet</h1>
<p class="note">Design pass for the founder's Nov 19 request (voice): when he says a piece isn't the one the app asked about, a sheet asks what it is, shows his other pieces of that kind so he can say "it's this one" instead of adding a duplicate, and, for a new piece, confirms its kind. Frames are the key states; light first, then dark. Nothing here is built, and no spec has changed.</p>
<div class="notes">
<div><b>Why the sheet opens on a new-piece row first.</b> The app's best guess was just ruled out, so a new piece is the likelier answer. The row sits above the grid so it never scrolls out of reach on a big closet.</div>
<div><b>Why a picked piece is confirmed.</b> Picking folds this photo into that piece (wears, photos). The comparison reuses the question's own two pictures and <b>Yes, same one</b>, so it reads like the question he just answered.</div>
<div><b>Which pieces are shown.</b> His other pieces in the same slot (top, bottom, shoes, layer), closest first. The piece he just said no to and the photographed piece itself are left out. Same rule as "Same as which piece?".</div>
<div><b>Apple HIG.</b> A sheet with medium and large detents, a grabber, and a visible close button; one level of navigation inside it (Back on the kind step), never a second sheet. Targets: tiles 113 × 104+, rows 56, chips and buttons 44 pt with the invisible padding. Dynamic Type: at the largest sizes the grid is 2 across and the kind options 1 across, and the sheet opens at large only.</div>
<div><b>Checks.</b> No emoji, no all-caps; colors are the tokens in both themes; picked state is a ring and a check (never color alone); the photo piece's name is shown so nothing is added unnamed.</div>
<div><b>Not drawn, in the proposal.</b> Dynamic Type frames, VoiceOver order, and the exact pass/fail checks are in <code>spec-proposal.md</code>.</div>
</div></div>`+panel('light')+panel('dark');
