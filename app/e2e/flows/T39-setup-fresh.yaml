# T39 · OS3.1, OS3.2, OS5.1, OS5.2 (Agree), OS5.5, F1.1, SY4.1 (tasks/T39/TESTING.md), retargeted by T113 (the style
# game, specs/style-game.md; F1.1 is now "18 taps or fewer with 3 Me's", #504, the lesson's tap included): a fresh install
# reaches a live camera in at most 18 taps: Get started (1), card 1's lesson (2, SG1.4, #503), Yes on 3 cards (3–5),
# No on 5 (6–10), the ranking's left card while it shows (at most 3: 11–13), Continue (14), 22–25 (15), Continue (16),
# the card's Check my fit (17), Agree (18). The lesson shows on the first game only. No bubble on
# Looks or About you, no agreement screen in setup, no sign-in and no paywall on the way, and the camera never opens on
# its own. The name is typed (#506: the field opens focused, and typing isn't a tap). Taps on the game are by testID: the deal is random on a fresh
# install, so nothing here depends on which look is on a card.
# Run: maestro --device 111D0A09-C2CA-4F72-BF3C-44019A05C89D test -e PORT=8082 app/e2e/flows/T39-setup-fresh.yaml
# (PORT defaults to 8081). No demo arguments: a demo screen opens the camera without the agreement. The development
# launcher's server tap is not one of the 18 (it isn't in the app).
# Matching: Maestro matches an element's WHOLE text or label. A Kit line is one element "Kit: <text>"; the offer's title
# and body are one VoiceOver element.
appId: com.trykitted.kitted
name: T39 · fresh install to a live camera (3 Yes's; 18 taps at most, the lesson's tap included)
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://.*:${PORT || '8081'}"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"

# Tap 1.
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Is this your style\\?"
    timeout: 10000
- assertVisible: "One outfit at a time\\."
- assertNotVisible: "Me or not me\\?"
- assertNotVisible: "What's your style\\?"
- assertNotVisible: "Kit: .*"
- assertNotVisible: ".*Good pick.*"
- assertNotVisible: "Which of these would you actually wear\\? Tap up to 3\\."
- assertNotVisible: "Privacy agreement"
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"
- assertVisible: "Step 2 of 3"

# Tap 2: card 1's overlay (SG1.4).
- assertVisible: "Swipe right if it's your style, left if it's not\\."
- tapOn: "Swipe right if it's your style, left if it's not\\."
- assertNotVisible: "Swipe right if it's your style, left if it's not\\."
# Taps 3–5: Yes on three cards.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "game-me"
      - waitForAnimationToEnd:
          timeout: 3000
# Taps 6–10: No on the other five.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "game-notme"
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible:
    id: "game-me"
# Taps 11–13 at most: the ranking's left card while it shows.
- repeat:
    times: 3
    while:
      visible:
        id: "rank-pick-left"
    commands:
      - tapOn:
          id: "rank-pick-left"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Here's your style"
    timeout: 10000
- assertNotVisible:
    id: "rank-pick-left"
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"
# Tap 14.
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "About you"
    timeout: 10000
- assertVisible: "Step 3 of 3"
- assertVisible: "What should Kit call you\\?"
- assertVisible: "How old are you\\?"
- assertNotVisible: "Kit: .*"
- assertNotVisible: ".*Good pick.*"
- assertNotVisible: "Not sure yet"
- assertNotVisible: "Privacy agreement"
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"
# #506: a small Skip until he types (the hint above Continue is hidden from VoiceOver, so Maestro can't see it; the
# render tests check it).
- assertVisible: "Skip"
# Not a tap: the field has focus when the step opens, so the letters go straight in.
- inputText: "Alex"
- assertNotVisible: "Skip"

# Tap 15.
- tapOn: "22–25"
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"

# Tap 16.
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Want to check a fit now\\? Stand back so your shoes are in the shot\\. Not dressed for it\\? Later works\\."
    timeout: 15000
- assertVisible: ".*I'm Kit, your stylist\\."
- assertVisible:
    text: "Want to check a fit now\\? Stand back so your shoes are in the shot\\. Not dressed for it\\? Later works\\."
    below: ".*I'm Kit, your stylist\\."
- assertVisible: "Later"
- assertNotVisible: "Privacy agreement"
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"
# The camera doesn't open on its own: wait 3 s, then check.
- extendedWaitUntil:
    visible: "T39 · this never appears"
    timeout: 3000
    optional: true
- assertNotVisible: "Take photo"
- assertNotVisible: "Please read this and agree before your first fit check\\. Nothing is sent until you do\\."

# Tap 17: the card's Check my fit (the first of the two "Check my fit" buttons; the accessory's is below it).
- tapOn:
    text: "Check my fit\\. Opens the camera\\."
    below: "Want to check a fit now\\?.*"
    index: 0
- extendedWaitUntil:
    visible: "Privacy agreement"
    timeout: 10000
- assertVisible: "Please read this and agree before your first fit check\\. Nothing is sent until you do\\."
- assertVisible: "Agree and continue"
- assertVisible: "Not now"
- assertNotVisible: "Kit: .*"
- assertNotVisible: "Take photo"
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"

# Tap 18.
- tapOn: "Agree and continue"
- extendedWaitUntil:
    visible: "Take photo"
    timeout: 10000
- assertNotVisible: "Continue free"
- assertNotVisible: "Up to .* checks a day\\.[\\s\\S]*"
