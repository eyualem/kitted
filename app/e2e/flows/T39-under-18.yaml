# T39 · OS4.4, F1.2 (tasks/T39/TESTING.md): Under 18 on About you asks once; Change changes nothing; That's right shows
# the age stop with no way to the camera, and it stays after a relaunch. The flow ends by clearing the app and the
# Keychain, so the Simulator is never left on the stop screen.
# Run: maestro --device 111D0A09-C2CA-4F72-BF3C-44019A05C89D test app/e2e/flows/T39-under-18.yaml (Metro running; another worktree's Metro: -e PORT=8082)
appId: com.trykitted.kitted
name: T39 · Under 18 stops the app
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://.*:${PORT || '8081'}"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Is this your style\\?"
    timeout: 10000
# T113: Looks is the style game. The overlay's tap (SG1.4), Yes on card 1, No on the rest, Continue (11 taps).
- runFlow: ../common/play-style-game.yaml
- extendedWaitUntil:
    visible: "About you"
    timeout: 10000
- assertVisible: "Under 18"
- assertNotVisible: "Born in .*"
- tapOn: "Under 18"
# #497: no name typed, so Skip is the way on; it asks the same as Continue.
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Under 18\\?"
    timeout: 5000
- assertVisible: "Kitted is for ages 18 and up\\."
- tapOn: "Change"
- extendedWaitUntil:
    visible: "About you"
    timeout: 5000
- assertNotVisible: "Thanks for checking it out\\. You can delete the app from your Home Screen\\."
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Under 18\\?"
    timeout: 5000
- tapOn: "That's right"
- extendedWaitUntil:
    visible: "Thanks for checking it out\\. You can delete the app from your Home Screen\\."
    timeout: 10000
- assertVisible: "Kitted is for ages 18 and up\\."
- assertNotVisible: "Back"
- assertNotVisible: "Take photo"
- assertNotVisible: "Check my fit\\. Opens the camera\\."

# Relaunch (no clearing): the stop screen again.
- stopApp
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://.*:${PORT || '8081'}"
- extendedWaitUntil:
    visible: "Thanks for checking it out\\. You can delete the app from your Home Screen\\."
    timeout: 90000
- assertVisible: "Kitted is for ages 18 and up\\."
- assertNotVisible: "Back"
- assertNotVisible: "Take photo"
- assertNotVisible: "Get started"

# Leave the Simulator clean.
- launchApp:
    clearState: true
    clearKeychain: true
