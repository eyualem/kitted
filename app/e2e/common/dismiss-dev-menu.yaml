# A development build shows its developer-menu intro once after the app's state is cleared, and Continue opens the menu
# itself; close both (neither is an app tap). Does nothing on a build without it.
appId: com.trykitted.kitted
---
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
      - tapOn:
          point: "90%,48%"
