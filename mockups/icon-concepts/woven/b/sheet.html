<!doctype html><html><head><meta charset="utf-8"><title>Woven B Sheet</title>
<style>
body{margin:0;padding:16px;background:#E9EBEF;font:12px -apple-system,sans-serif;color:#222}
.row{display:flex;gap:18px;align-items:flex-end;margin-bottom:14px}
.cell{display:flex;gap:10px;align-items:flex-end;padding:10px;border-radius:12px}
.l{background:#fff}.d{background:#0B0C10}.t{background:linear-gradient(160deg,#2A2219,#141210)}
img{border-radius:22.37%;display:block}
.t img{filter:sepia(1) saturate(1.7) brightness(.97);background:#211B15}
.n{width:24px;font-weight:700}
</style></head><body><div id="r"></div>
<script>
const ids=(new URLSearchParams(location.search).get('ids')||'b1,b2,b3,b4').split(',');
const im=(s,z)=>`<img src="${s}" width="${z}" height="${z}">`;
document.getElementById('r').innerHTML=ids.map(id=>`<div class="row"><div class="n">${id}</div>
<div class="cell l">${im(id+'.svg',220)}${im(id+'.svg',87)}${im(id+'.svg',58)}${im(id+'.svg',29)}</div>
<div class="cell d">${im(id+'-dark.svg',87)}${im(id+'-dark.svg',58)}</div>
<div class="cell t">${im(id+'-tint.svg',87)}${im(id+'-tint.svg',58)}</div></div>`).join('');
</script></body></html>
